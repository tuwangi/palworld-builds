name: Validate catalog

on:
  push:
    paths-ignore:
      - "data/profiles/**"
  pull_request:
    paths-ignore:
      - "data/profiles/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:translations
